<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Estefano Poblete">
    <title>VideoStream</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav>
            <div class="izquierda">
                <img src="static/images/Youtube_logo (1).png" alt="Logo" class="logo">
                <a href="#" class="link">Inicio</a>
                <a href="#" class="link">Explorar</a>
                <a href="#" class="link">Mi lista</a>
            </div>
            <div class="derecha">
                <input type="text">
                <img src="static/images/campana.png" alt="" class="campana">
                <img src="static/images/Default_pfp.png" alt="" class="perfil">
            </div>
        </nav>
    </header>
    <main>
        <section class="parteGrande">
            <div class="video">
                <video src="" controls></video>
            </div>
            <div class="infoVideo">
                <h1>Lagos y montañas</h1>
                <p>95 mil visualizaciones - 10 abr 2024</p>
            </div>
            <div class="likes">
                <img src="" alt="" class="like">
                <p id="numeroLike">10</p>

                <img src="" alt="" class="dislike">
                <p id="numeroDislike">2</p>

                <img src="" alt="" class="compartir">
                <p>Compartir</p>
                <img src="" alt="" class="cola">
                <p>Añadir a la cola</p>
                <img src="" alt="" class="puntos">
            </div>
            <div class="canal">
                <img src="" alt="" class="fotoCanal">
                <div class="noombreCanal">
                    <p class="nombre">VideoStream</p>
                    <p><span id="sub">10</span> suscriptores</p>
                </div>
                <div class="subscribe">
                    <button>Suscribirse</button>
                </div>
            </div>
        </section>
    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
